<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>로또 번호 추첨기</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", sans-serif;
    background: #f5f5f2;
    display: flex;
    justify-content: center;
    padding: 40px 16px;
    margin: 0;
  }
  .card {
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    padding: 32px;
    width: 100%;
    max-width: 480px;
  }
  h1 {
    font-size: 20px;
    font-weight: 600;
    text-align: center;
    margin: 0 0 24px;
    color: #222;
  }
  .balls-row {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    min-height: 56px;
    margin-bottom: 12px;
  }
  .plus {
    font-size: 20px;
    color: #999;
    font-weight: 300;
  }
  .ball {
    width: 46px;
    height: 46px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 17px;
    color: #fff;
  }
  .ball.bonus {
    border: 2px dashed #999;
  }
  .bonus-label {
    text-align: center;
    font-size: 12px;
    color: #999;
    margin-bottom: 20px;
  }
  .controls {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-bottom: 20px;
  }
  button, select {
    font-size: 14px;
    padding: 10px 16px;
    border-radius: 8px;
    border: 1px solid #ddd;
    background: #fff;
    cursor: pointer;
  }
  button {
    background: #222;
    color: #fff;
    border: none;
    font-weight: 600;
  }
  button:hover { background: #444; }
  #games-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-top: 8px;
  }
  .game-row {
    display: flex;
    align-items: center;
    gap: 10px;
    border: 1px solid #eee;
    border-radius: 10px;
    padding: 8px 12px;
  }
  .game-label {
    font-size: 12px;
    color: #999;
    min-width: 40px;
  }
  .game-balls {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .ball-sm {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 700;
    color: #fff;
  }
  .ball-sm.bonus { border: 1.5px dashed #999; }
</style>
</head>
<body>
<div class="card">
  <h1>로또 번호 추첨기</h1>
  <div class="balls-row" id="balls"></div>
  <div class="bonus-label">점선 테두리 = 보너스 번호</div>
  <div class="controls">
    <button id="draw-btn">번호 추첨하기</button>
    <select id="count-select">
      <option value="1">1게임</option>
      <option value="5">5게임</option>
    </select>
  </div>
  <div id="games-list"></div>
</div>

<script>
function colorForNumber(n) {
  if (n <= 10) return '#fbc02d';
  if (n <= 20) return '#2196f3';
  if (n <= 30) return '#e53935';
  if (n <= 40) return '#757575';
  return '#43a047';
}

function drawOneGame() {
  const pool = [];
  for (let i = 1; i <= 45; i++) pool.push(i);
  for (let i = pool.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [pool[i], pool[j]] = [pool[j], pool[i]];
  }
  const main = pool.slice(0, 6).sort((a, b) => a - b);
  const bonus = pool[6];
  return { main, bonus };
}

function ballHtml(n, size, isBonus) {
  const bg = colorForNumber(n);
  const cls = size === 'lg' ? 'ball' : 'ball-sm';
  const bonusCls = isBonus ? ' bonus' : '';
  return '<div class="' + cls + bonusCls + '" style="background:' + bg + ';">' + n + '</div>';
}

function renderMain(game) {
  const el = document.getElementById('balls');
  let html = game.main.map(n => ballHtml(n, 'lg', false)).join('');
  html += '<span class="plus">+</span>';
  html += ballHtml(game.bonus, 'lg', true);
  el.innerHTML = html;
}

function renderGamesList(games) {
  const el = document.getElementById('games-list');
  if (games.length <= 1) {
    el.innerHTML = '';
    return;
  }
  el.innerHTML = games.map((game, i) => {
    let balls = game.main.map(n => ballHtml(n, 'sm', false)).join('');
    balls += ballHtml(game.bonus, 'sm', true);
    return '<div class="game-row"><span class="game-label">' + (i + 1) + '게임</span><div class="game-balls">' + balls + '</div></div>';
  }).join('');
}

document.getElementById('draw-btn').addEventListener('click', () => {
  const count = parseInt(document.getElementById('count-select').value, 10);
  const games = [];
  for (let i = 0; i < count; i++) games.push(drawOneGame());
  renderMain(games[0]);
  renderGamesList(games);
});

renderMain(drawOneGame());
</script>
</body>
</html>
