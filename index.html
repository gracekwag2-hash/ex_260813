<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>나와 데이트할래?</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", sans-serif;
    background: linear-gradient(135deg, #ffdde1, #ffc1cc, #ffb6d5);
  }
  .stage {
    position: relative;
    width: 100vw;
    height: 100vh;
  }
  .heart {
    position: absolute;
    bottom: -40px;
    font-size: 24px;
    opacity: 0.7;
    animation: floatUp linear infinite;
    pointer-events: none;
    user-select: none;
  }
  @keyframes floatUp {
    0% { transform: translateY(0) rotate(0deg); opacity: 0.8; }
    100% { transform: translateY(-110vh) rotate(30deg); opacity: 0; }
  }
  .screen {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    z-index: 2;
    width: 100%;
    max-width: 420px;
    padding: 0 20px;
  }
  .screen.hidden { display: none; }

  h1 {
    font-size: 32px;
    color: #d6336c;
    margin: 0 0 8px;
    text-shadow: 0 2px 8px rgba(255,255,255,0.6);
    word-break: keep-all;
  }
  .sub {
    font-size: 15px;
    color: #a61e4d;
    margin: 0 0 36px;
  }

  /* 이름 입력 화면 */
  .setup-card {
    background: rgba(255,255,255,0.85);
    border-radius: 24px;
    padding: 28px 24px;
    box-shadow: 0 10px 30px rgba(214, 51, 108, 0.18);
  }
  .setup-card h2 {
    font-size: 22px;
    color: #d6336c;
    margin: 0 0 4px;
  }
  .setup-card .desc {
    font-size: 13px;
    color: #a61e4d;
    margin: 0 0 22px;
    line-height: 1.5;
  }
  .field {
    text-align: left;
    margin-bottom: 14px;
  }
  .field label {
    display: block;
    font-size: 13px;
    font-weight: 700;
    color: #a61e4d;
    margin-bottom: 6px;
  }
  .field input {
    width: 100%;
    font-size: 16px;
    padding: 13px 14px;
    border-radius: 12px;
    border: 2px solid #ffc1cc;
    background: #fff;
    outline: none;
    font-family: inherit;
  }
  .field input:focus { border-color: #d6336c; }

  .primary-btn {
    width: 100%;
    font-size: 17px;
    font-weight: 700;
    padding: 15px;
    border-radius: 999px;
    border: none;
    background: #d6336c;
    color: #fff;
    cursor: pointer;
    margin-top: 8px;
    font-family: inherit;
  }
  .primary-btn:hover { background: #c2255c; }
  .primary-btn:active { transform: scale(0.98); }

  .ghost-btn {
    width: 100%;
    font-size: 14px;
    font-weight: 700;
    padding: 12px;
    border-radius: 999px;
    border: 2px solid #ffc1cc;
    background: transparent;
    color: #d6336c;
    cursor: pointer;
    margin-top: 10px;
    font-family: inherit;
  }
  .ghost-btn:hover { background: rgba(255,255,255,0.6); }

  .error-msg {
    font-size: 13px;
    color: #c2255c;
    font-weight: 700;
    margin: 10px 0 0;
    min-height: 18px;
  }

  /* 링크 생성 결과 */
  .link-box {
    margin-top: 18px;
    padding-top: 18px;
    border-top: 1px dashed #ffc1cc;
    text-align: left;
  }
  .link-box.hidden { display: none; }
  .link-box p.label {
    font-size: 13px;
    font-weight: 700;
    color: #a61e4d;
    margin: 0 0 8px;
  }
  .link-value {
    font-size: 12px;
    color: #555;
    background: #fff;
    border: 2px solid #ffe0e8;
    border-radius: 10px;
    padding: 10px 12px;
    word-break: break-all;
    line-height: 1.5;
    max-height: 72px;
    overflow-y: auto;
  }

  /* 게임 화면 */
  .button-row {
    display: flex;
    justify-content: center;
    gap: 24px;
    position: relative;
  }
  .btn {
    font-size: 20px;
    font-weight: 700;
    padding: 16px 36px;
    border-radius: 999px;
    border: none;
    cursor: pointer;
    box-shadow: 0 6px 16px rgba(214, 51, 108, 0.3);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    white-space: nowrap;
    font-family: inherit;
  }
  .btn:active { transform: scale(0.95); }
  .btn.yes {
    background: #d6336c;
    color: #fff;
  }
  .btn.yes:hover {
    background: #c2255c;
    box-shadow: 0 8px 20px rgba(214, 51, 108, 0.45);
  }
  .btn.no {
    background: #fff;
    color: #d6336c;
    border: 2px solid #ffb6d5;
    z-index: 5;
    transition: transform 0.15s ease;
  }

  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(198, 34, 92, 0.55);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
    padding: 20px;
  }
  .overlay.show {
    opacity: 1;
    pointer-events: auto;
  }
  .popup {
    background: #fff;
    border-radius: 24px;
    padding: 40px 44px;
    text-align: center;
    box-shadow: 0 20px 50px rgba(0,0,0,0.25);
    transform: scale(0.8);
    transition: transform 0.25s ease;
  }
  .overlay.show .popup { transform: scale(1); }
  .popup .emoji {
    font-size: 48px;
    margin-bottom: 12px;
  }
  .popup p {
    font-size: 24px;
    font-weight: 700;
    color: #d6336c;
    margin: 0 0 10px;
  }
  .popup .couple {
    font-size: 16px;
    font-weight: 700;
    color: #a61e4d;
    margin: 0 0 6px;
  }
  .popup span.note {
    font-size: 14px;
    color: #999;
  }

  @media (max-width: 480px) {
    h1 { font-size: 24px; }
    .btn { font-size: 16px; padding: 14px 26px; }
    .button-row { gap: 16px; }
    .popup { padding: 32px 28px; }
  }
</style>
</head>
<body>

<div class="stage" id="stage">

  <!-- 1단계: 이름 입력 -->
  <div class="screen" id="setup-screen">
    <div class="setup-card">
      <h2>두근두근 고백하기 💌</h2>
      <p class="desc">이름을 넣으면 상대방에게 보낼<br>나만의 고백 링크가 만들어져요</p>

      <div class="field">
        <label for="input-from">내 이름</label>
        <input type="text" id="input-from" placeholder="예) 은한" maxlength="12" autocomplete="off">
      </div>

      <div class="field">
        <label for="input-to">상대방 이름</label>
        <input type="text" id="input-to" placeholder="예) 혜원" maxlength="12" autocomplete="off">
      </div>

      <p class="error-msg" id="error-msg"></p>

      <button class="primary-btn" id="btn-make-link">고백 링크 만들기 💗</button>
      <button class="ghost-btn" id="btn-preview">먼저 체험해보기</button>

      <div class="link-box hidden" id="link-box">
        <p class="label">이 링크를 상대방에게 보내세요 👇</p>
        <div class="link-value" id="link-value"></div>
        <button class="primary-btn" id="btn-copy">링크 복사하기</button>
      </div>
    </div>
  </div>

  <!-- 2단계: 게임 -->
  <div class="screen hidden" id="game-screen">
    <h1 id="game-title">나와 데이트할래? 💕</h1>
    <p class="sub" id="game-sub">신중하게 골라줘</p>
    <div class="button-row">
      <button class="btn yes" id="btn-yes">좋아!!</button>
      <button class="btn no" id="btn-no">싫어!!</button>
    </div>
  </div>

</div>

<div class="overlay" id="overlay">
  <div class="popup">
    <div class="emoji">🥰</div>
    <p>히히 나도 좋아!!</p>
    <p class="couple" id="popup-couple"></p>
    <span class="note">빨리 만나러 가자 🫶</span>
  </div>
</div>

<script>
const stage = document.getElementById('stage');
const setupScreen = document.getElementById('setup-screen');
const gameScreen = document.getElementById('game-screen');
const noBtn = document.getElementById('btn-no');
const yesBtn = document.getElementById('btn-yes');
const overlay = document.getElementById('overlay');

// 한국어 조사 처리 (받침 유무에 따라 자동 선택)
function hasJongseong(name) {
  if (!name) return false;
  const c = name.charCodeAt(name.length - 1);
  if (c < 0xAC00 || c > 0xD7A3) return false; // 한글이 아니면 받침 없음으로 처리
  return (c - 0xAC00) % 28 !== 0;
}
function josa(name, withJong, withoutJong) {
  return hasJongseong(name) ? withJong : withoutJong;
}

// ---------- 1단계: 이름 입력 ----------
const inputFrom = document.getElementById('input-from');
const inputTo = document.getElementById('input-to');
const errorMsg = document.getElementById('error-msg');
const linkBox = document.getElementById('link-box');
const linkValue = document.getElementById('link-value');

function readNames() {
  return {
    from: inputFrom.value.trim(),
    to: inputTo.value.trim()
  };
}

function validate() {
  const { from, to } = readNames();
  if (!from || !to) {
    errorMsg.textContent = '두 사람의 이름을 모두 적어주세요!';
    return null;
  }
  errorMsg.textContent = '';
  return { from, to };
}

function buildLink(from, to) {
  const base = location.origin + location.pathname;
  return base + '?from=' + encodeURIComponent(from) + '&to=' + encodeURIComponent(to);
}

document.getElementById('btn-make-link').addEventListener('click', () => {
  const names = validate();
  if (!names) return;
  linkValue.textContent = buildLink(names.from, names.to);
  linkBox.classList.remove('hidden');
});

document.getElementById('btn-copy').addEventListener('click', async (e) => {
  const text = linkValue.textContent;
  const btn = e.currentTarget;
  try {
    await navigator.clipboard.writeText(text);
    btn.textContent = '복사 완료! ✓';
  } catch (err) {
    // 클립보드 권한이 없을 때는 직접 선택할 수 있게 안내
    const range = document.createRange();
    range.selectNodeContents(linkValue);
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
    btn.textContent = '길게 눌러 복사해주세요';
  }
  setTimeout(() => { btn.textContent = '링크 복사하기'; }, 2000);
});

document.getElementById('btn-preview').addEventListener('click', () => {
  const names = validate();
  if (!names) return;
  startGame(names.from, names.to);
});

// 엔터로 넘어가기
[inputFrom, inputTo].forEach((el) => {
  el.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter') return;
    if (el === inputFrom) {
      inputTo.focus();
    } else {
      document.getElementById('btn-make-link').click();
    }
  });
});

// ---------- 2단계: 게임 ----------
let gameActive = false;

function startGame(from, to) {
  // textContent만 사용해 이름을 넣습니다 (HTML로 해석되지 않도록)
  document.getElementById('game-title').textContent =
    to + josa(to, '아', '야') + ', 나와 데이트할래? 💕';
  document.getElementById('game-sub').textContent =
    from + josa(from, '이', '가') + ' 물어보는 중… 신중하게 골라줘';
  document.getElementById('popup-couple').textContent = from + ' ♥ ' + to;

  setupScreen.classList.add('hidden');
  gameScreen.classList.remove('hidden');
  gameActive = true;
}

// 링크에 이름이 담겨 있으면 입력 화면을 건너뛰고 바로 게임 시작
(function initFromUrl() {
  const params = new URLSearchParams(location.search);
  const from = (params.get('from') || '').trim().slice(0, 12);
  const to = (params.get('to') || '').trim().slice(0, 12);
  if (from && to) startGame(from, to);
})();

// ---------- '싫어!!' 버튼 도망 로직 ----------
let dodging = false;
const EDGE_MARGIN = 12;

function boundsFor(w, h) {
  const maxLeft = Math.max(EDGE_MARGIN, window.innerWidth - w - EDGE_MARGIN);
  const maxTop = Math.max(EDGE_MARGIN, window.innerHeight - h - EDGE_MARGIN);
  return { maxLeft, maxTop };
}

function randomPosition() {
  const { maxLeft, maxTop } = boundsFor(noBtn.offsetWidth, noBtn.offsetHeight);
  const x = EDGE_MARGIN + Math.random() * Math.max(0, maxLeft - EDGE_MARGIN);
  const y = EDGE_MARGIN + Math.random() * Math.max(0, maxTop - EDGE_MARGIN);
  return { x, y };
}

function activateFixedMode() {
  if (dodging) return;
  const rect = noBtn.getBoundingClientRect();
  noBtn.style.position = 'fixed';
  noBtn.style.left = rect.left + 'px';
  noBtn.style.top = rect.top + 'px';
  noBtn.style.margin = '0';
  dodging = true;
  clampToViewport();
}

// 창 크기가 바뀌어도(리사이즈, 화면 회전 등) 버튼이 화면 밖으로 나가지 않도록 위치를 다시 맞춤
function clampToViewport() {
  if (!dodging) return;
  const rect = noBtn.getBoundingClientRect();
  const { maxLeft, maxTop } = boundsFor(rect.width, rect.height);
  noBtn.style.left = Math.min(Math.max(EDGE_MARGIN, rect.left), maxLeft) + 'px';
  noBtn.style.top = Math.min(Math.max(EDGE_MARGIN, rect.top), maxTop) + 'px';
}
window.addEventListener('resize', clampToViewport);
window.addEventListener('orientationchange', clampToViewport);

function dodge() {
  activateFixedMode();
  const { x, y } = randomPosition();
  noBtn.style.left = x + 'px';
  noBtn.style.top = y + 'px';
}

// 데스크톱: 버튼에 실제로 가까워지기 전까지는 절대 움직이지 않음
const THRESHOLD = 65;     // 이 거리 안에 들어와야 반응 시작
const MAX_SPEED = 1.1;    // 프레임당 최대 이동 거리 (작을수록 슬금슬금)

let lastMouseX = null;
let lastMouseY = null;

document.addEventListener('mousemove', (e) => {
  if (!gameActive) return;
  lastMouseX = e.clientX;
  lastMouseY = e.clientY;
  activateFixedMode();
});

function animateDodge() {
  requestAnimationFrame(animateDodge);
  if (!gameActive || !dodging || lastMouseX === null) return;

  const rect = noBtn.getBoundingClientRect();
  const { maxLeft, maxTop } = boundsFor(rect.width, rect.height);

  const dx = (rect.left + rect.width / 2) - lastMouseX;
  const dy = (rect.top + rect.height / 2) - lastMouseY;
  const dist = Math.hypot(dx, dy) || 1;

  // 임계 거리 밖이면 완전히 정지 상태 유지
  if (dist >= THRESHOLD) return;

  const speed = (1 - dist / THRESHOLD) * MAX_SPEED;
  const angle = Math.atan2(dy, dx);

  noBtn.style.left = Math.min(Math.max(EDGE_MARGIN, rect.left + Math.cos(angle) * speed), maxLeft) + 'px';
  noBtn.style.top = Math.min(Math.max(EDGE_MARGIN, rect.top + Math.sin(angle) * speed), maxTop) + 'px';
}
requestAnimationFrame(animateDodge);

// 모바일: 터치(클릭 시도)하는 순간 도망
noBtn.addEventListener('touchstart', (e) => {
  e.preventDefault();
  dodge();
}, { passive: false });

noBtn.addEventListener('pointerdown', (e) => {
  if (e.pointerType === 'touch') {
    e.preventDefault();
    dodge();
  }
});

// 안전장치: 혹시라도 클릭이 성사되면 무시
noBtn.addEventListener('click', (e) => {
  e.preventDefault();
  dodge();
});

yesBtn.addEventListener('click', () => {
  overlay.classList.add('show');
});

// 팝업 바깥을 누르면 게임 화면으로 복귀
overlay.addEventListener('click', (e) => {
  if (e.target !== overlay) return;
  overlay.classList.remove('show');
  dodging = false;
  lastMouseX = null;
  lastMouseY = null;
  noBtn.style.position = '';
  noBtn.style.left = '';
  noBtn.style.top = '';
  noBtn.style.margin = '';
});

// ---------- 떠다니는 하트 배경 ----------
function spawnHeart() {
  const heart = document.createElement('div');
  heart.className = 'heart';
  heart.textContent = ['💕','💗','💖','💘'][Math.floor(Math.random() * 4)];
  heart.style.left = Math.random() * 100 + 'vw';
  heart.style.fontSize = (16 + Math.random() * 20) + 'px';
  const duration = 6 + Math.random() * 6;
  heart.style.animationDuration = duration + 's';
  stage.appendChild(heart);
  setTimeout(() => heart.remove(), duration * 1000);
}
setInterval(spawnHeart, 500);
</script>

</body>
</html>
